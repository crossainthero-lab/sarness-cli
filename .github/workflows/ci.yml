name: CLI tests and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CLI and test dependencies
        run: python -m pip install '.[dev]'
      - name: Verify installed CLI, real tools, and terminal sessions
        run: SARNESS_TEST_EXECUTABLE="$(command -v sarness)" python -m pytest tests -q
      - name: Check installer and build wheel
        run: |
          bash -n install.sh
          python -m pip wheel . --no-deps --wheel-dir dist
